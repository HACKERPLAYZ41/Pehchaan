<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Pehchaan DRP</title>
    <style>
        :root {
            --paper: #F6F3EC;
            --ink: #1B1A17;
            --vermilion: #D8432B;
            --olive: #5B6B4E;
            --border: #E5E0D5;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--paper);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 8px;
            max-width: 480px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(27, 26, 23, 0.05);
        }
        .tag {
            display: inline-block;
            background: rgba(216, 67, 43, 0.1);
            color: var(--vermilion);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        p {
            color: #55524B;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: var(--ink);
            color: #FFFFFF;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #88847C;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="tag">HTTP 404 Error</span>
        <h1>Page Not Found</h1>
        <p>The requested security resource, route, or endpoint does not exist or has been moved.</p>
        <a href="/" class="btn">Return to Pehchaan Dashboard</a>
        <div class="footer">
            Pehchaan Digital Risk Protection &bull; Blockcode Security
        </div>
    </div>
</body>
</html>
