name: Deploy to cPanel (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Frontend (dist) & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚡ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build Production Bundle (dist)
        working-directory: ./frontend
        run: npm run build

      - name: 📦 Assemble Full-Stack Deployment Package
        run: |
          mkdir -p cpanel_deploy
          
          # 1. Copy built frontend SPA files (index.html, assets, icons)
          cp -r frontend/dist/* cpanel_deploy/
          
          # 2. Copy production Apache .htaccess, API gateway router, and SEO assets
          cp public_html/.htaccess cpanel_deploy/.htaccess
          cp public_html/index.php cpanel_deploy/index.php
          cp public_html/robots.txt cpanel_deploy/robots.txt
          cp public_html/sitemap.xml cpanel_deploy/sitemap.xml
          mkdir -p cpanel_deploy/api
          cp public_html/api/index.php cpanel_deploy/api/index.php
          
          # 3. Copy backend source code, configuration, and database schemas
          mkdir -p cpanel_deploy/backend
          cp -r backend/src cpanel_deploy/backend/src
          cp -r backend/config cpanel_deploy/backend/config
          cp -r backend/database cpanel_deploy/backend/database
          
          # 4. Ensure uploads directory exists with .gitkeep
          mkdir -p cpanel_deploy/uploads
          touch cpanel_deploy/uploads/.gitkeep
          
          echo "Full-stack package assembled successfully:"
          ls -la cpanel_deploy

      - name: 🛠️ Install lftp Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: 🚀 Upload Full Stack directly to cPanel
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.CPANEL_FTP_PORT || '21' }}
        run: |
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-allow auto;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 10;
            set net:reconnect-interval-base 3;
            open -u \"$FTP_USER\",\"$FTP_PASS\" -p $FTP_PORT \"$FTP_SERVER\";
            
            # Preserve server's existing .env file and .git files while syncing
            # Detect whether root is already public_html or if public_html subfolder exists
            if cd public_html; then
              echo 'Found public_html folder, uploading full stack into public_html/...';
              mirror -R --verbose --exclude-glob .git* --exclude-glob .env* cpanel_deploy/ .;
            else
              echo 'Root is target directory, uploading full stack directly into root...';
              mirror -R --verbose --exclude-glob .git* --exclude-glob .env* cpanel_deploy/ .;
            fi;
            quit;
          "
