name: Deploy to cPanel (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Frontend (dist) & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚡ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build Production Bundle (dist)
        working-directory: ./frontend
        run: npm run build

      - name: 🛠️ Install lftp Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: 🚀 Upload dist contents directly to cPanel
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.CPANEL_FTP_PORT || '21' }}
        run: |
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-allow auto;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 10;
            set net:reconnect-interval-base 3;
            open -u \"$FTP_USER\",\"$FTP_PASS\" -p $FTP_PORT \"$FTP_SERVER\";
            
            # Detect whether root is already public_html or if public_html subfolder exists
            if cd public_html; then
              echo 'Found public_html folder, uploading dist files into public_html/...';
              mirror -R --verbose frontend/dist/ .;
            else
              echo 'Root is the target directory, uploading dist files directly into root...';
              mirror -R --verbose frontend/dist/ .;
            fi;
            quit;
          "
