name: Deploy to cPanel (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Frontend & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚡ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: 🔄 Sync Dist to public_html
        run: |
          mkdir -p public_html/assets
          rm -rf public_html/assets/*
          cp -r frontend/dist/* public_html/

      - name: 🛠️ Install lftp Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: 🚀 Mirror to cPanel via lftp (Auto-Retry & Resilient Transfer)
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.CPANEL_FTP_PORT || '21' }}
        run: |
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-allow auto;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 10;
            set net:reconnect-interval-base 3;
            open -u \"$FTP_USER\",\"$FTP_PASS\" -p $FTP_PORT \"$FTP_SERVER\";
            echo 'Uploading backend directory...';
            mirror -R --verbose --exclude-glob '*.pptx' --exclude-glob '*.ppt' backend/ backend/;
            echo 'Uploading public_html directory...';
            mirror -R --verbose --exclude-glob '*.pptx' --exclude-glob '*.ppt' public_html/ public_html/;
            quit;
          "
